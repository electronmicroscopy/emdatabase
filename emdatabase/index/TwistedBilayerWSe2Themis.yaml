TwistedBilayerWSe2Themis:
  description: >-
    Electron ptychography of a twisted bilayer WSe2, acquired at 80 kV on an uncorrected
    Thermo Fisher Themis with an EMPAD. From the Zenodo record for "Achieving sub-0.5-Angstrom
    resolution ptychography in an uncorrected electron microscope" (Science 384, adl2029). The 
    file is one member of the record's 1.9 GB Fig_01.zip and is fetched out of it directly. 
    It is a headerless raw: read it with 
    numpy.fromfile(path, dtype="<f4").reshape(128, 128, 130, 128)[..., :128, :].
