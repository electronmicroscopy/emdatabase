# $schema: ./json-schema.json
DE_SpotNet:
  description: >-
    Direct Electron's neural-network diffraction spot (Bragg disk) detector for 4D-STEM and
    scanning precession electron diffraction, the default detector in SpyDE, pyxem and quantem.
    Each pattern is rescaled so its disks are about 9 px across (diameter from the
    autocorrelation) and normalized; the network predicts a peak heat map and a sub-pixel
    offset. Trained across disk sizes, so it tolerates residual error in the rescale. An ONNX
    graph (BatchNorm folded, opset 17, dynamic batch/height/width, configuration in the model
    metadata) for inference with ONNX Runtime; the torch checkpoint for training and fine-tuning
    is the DE_SpotNet_Torch entry. Licensed CC BY-NC 4.0: commercial use (for example, analyzing
    your own data at a company) is permitted; the weights may not be redistributed in, or
    incorporated into, software or services that are sold.
  source: https://zenodo.org/records/23383572/files
  file: de_spotnet.onnx
  license: CC-BY-NC-4.0
  technique:
    - 4D-STEM
    - Diffraction
    - ML - peak finding
  doi: 10.5281/zenodo.23383571
  tags:
