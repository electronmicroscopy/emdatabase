# $schema: ./json-schema.json
DE_SpotNet_Production:
  description: >-
    DE SpotNet variant with short-range-order augmentation and an edge-decoupled head; slightly
    higher recall on crystalline 4D-STEM at the canonical disk size, weaker off its trained
    scale. An ONNX graph (BatchNorm folded, opset 17, dynamic batch/height/width, configuration
    in the model metadata) for inference with ONNX Runtime; the torch checkpoint for training
    and fine-tuning is the DE_SpotNet_Production_Torch entry. Licensed CC BY-NC 4.0: commercial
    use (for example, analyzing your own data at a company) is permitted; the weights may not be
    redistributed in, or incorporated into, software or services that are sold.
  source: https://zenodo.org/records/23383572/files
  file: de_spotnet_production.onnx
  license: CC-BY-NC-4.0
  technique:
