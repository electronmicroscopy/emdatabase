CuZnHAADF:
  description: The HAADF survey image acquired simultaneously with the CuZnEELSMapping
    spectrum image - copper and zinc oxide on carbon nanotubes. 40 x 50 pixels at
    0.9214 nm, uint16, on a JEOL ARM200F at 200 kV and 600000x. Pairs with
    CuZnEELSMapping for correlating elemental maps against the survey.
    Note - the Sample.description field in the file reads "Ta2O5 25% TiO2 CSIRO 400C",
    which is stale metadata carried over from an unrelated acquisition.
