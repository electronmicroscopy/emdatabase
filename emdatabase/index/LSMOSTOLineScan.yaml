# $schema: ./json-schema.json
LSMOSTOLineScan:
  description: A core-loss EELS line scan across a La(0.7)Sr(0.3)MnO3 thin film grown on
    SrTiO3, used by the eXSpy perovskite oxide analysis tutorial. 10 probe positions at
    3.152 nm with 512 energy channels covering 395-906 eV at 1 eV dispersion, which
    contains the Ti-L2,3, O-K, Mn-L2,3 and La-M4,5 edges - so a single line scan crosses
    the interface and shows the Ti signal give way to La and Mn. Acquired on a JEOL
    ARM200cF with a Gatan Quantum ER in DualEELS mode at 200 kV, 27.1 mrad convergence
    and 33.1 mrad collection angle. The matching low-loss spectrum needed for thickness
    correction and Fourier-ratio deconvolution is LSMOSTOLineScanLowLoss. Binned from
    the original acquisition to keep the file small.
  source: https://raw.githubusercontent.com/hyperspy/exspy-demos/927d1f21b3b8aba4e2e622c2e621d3d9d5542d1c/EELS/datasets
  checksum: md5:de31f7d7dc222727fac6e5ba92cac825
  file: LSMO_STO_linescan.hspy
  size_bytes: 42538
  detector_manufacturer: Gatan
  detector: Quantum ER
  microscope_vendor: JEOL
  microscope_model: ARM200cF
  voltage: 200 kV
  license: Unspecified
  technique: EELS
  tags:
