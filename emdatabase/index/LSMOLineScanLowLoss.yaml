# $schema: ./json-schema.json
LSMOLineScanLowLoss:
  description: The low-loss half of the DualEELS pair for LSMOLineScan - a
    La(0.7)Sr(0.3)MnO3 thin film line scan through a beam-damaged, oxygen-deficient
    region. 40 probe positions at 3.219 nm with 1024 energy channels covering -50 to
    461.5 eV at 0.5 eV dispersion, containing the zero-loss peak and plasmon region.
    Use it with the core-loss spectrum for relative thickness mapping and Fourier-ratio
    deconvolution before fine structure analysis. Acquired on a JEOL ARM200cF with a
    Gatan Quantum ER at 80 kV.
  source: https://raw.githubusercontent.com/hyperspy/exspy-demos/927d1f21b3b8aba4e2e622c2e621d3d9d5542d1c/EELS/datasets
  checksum: md5:37881582dd337c5f233befe6b99ed58a
  file: LSMO_linescan_low_loss.hspy
  size_bytes: 138806
  detector_manufacturer: Gatan
  detector: Quantum ER
  microscope_vendor: JEOL
  microscope_model: ARM200cF
  voltage: 80 kV
  license: Unspecified
  technique: EELS
  tags:
