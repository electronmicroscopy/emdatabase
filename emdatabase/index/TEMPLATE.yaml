# $schema: ./json-schema.json
#
# Copy this file to <YourDatasetName>.yaml, replace every placeholder, and open
# a pull request. Check it before you do with
#   python -m emdatabase.new_dataset --validate emdatabase/index/<YourDatasetName>.yaml
# This file is skipped by the catalogue, so the placeholder never appears as a
# dataset; the test suite still validates it.

# The entry name. Becomes the class name in `emdatabase.data`, so make it a
# CamelCase identifier. One entry per file, named after the entry.
MyDatasetName:
  # Required. What the data is, how it was acquired and how it is calibrated.
  description: One or two sentences on what this is, how it was acquired and how it is calibrated.
  # Required. The directory the file is served from, without the file name.
  source: https://zenodo.org/records/0000000/files
  # The full download link, and only needed when the file is not served at
  # `source/file` - a Google Drive link, or anything else with a query string.
  # `file` is still the name the file is saved under locally.
  url: https://zenodo.org/records/0000000/files/MyDatasetName.zspy
  # md5 of the file, as `md5:<32 hex>`. pooch refuses a download that does not match.
  checksum: md5:0123456789abcdef0123456789abcdef
  # Required. The file name at that source.
  file: MyDatasetName.zspy
  # The file's Content-Length in bytes; the weekly CI check compares it to the server.
  size_bytes: 1000000
  # Only for a file that lives inside a zip or 7z on a record you cannot republish,
  # where downloading the whole archive to get one file is not reasonable.
  # `download()` fetches just this member, with HTTP range requests, and hands
  # back a path like any other entry. `url`, `checksum` and `size_bytes` here
  # describe the archive and are what `download_url` points at; `file`,
  # `checksum` and `size_bytes` above go on describing the member, the file you
  # end up with. Give the complete path inside the zip: the same file name can
  # appear in several of its directories. Not allowed on a `kind: weights` entry.
  # A 7z compresses files together in solid blocks, so reaching a member means
  # decompressing its block from the start: measure the cost before adding one.
  # For a file that lives inside a .zip or .7z on someone else's record. The
  # entry's own `file`, `checksum` and `size_bytes` above are left out: they are
  # the first member's, stated once, here. `checksum` and `size_bytes` directly
  # under `archive` describe the archive itself and are optional.
  # archive:
  #   url: https://zenodo.org/records/0000000/files/Figures.zip
  #   checksum: md5:0123456789abcdef0123456789abcdef
  #   size_bytes: 2000000
  #   # Every file this entry puts on disk, described the same way. The first is
  #   # the one `download()` hands back; any others arrive beside it, which is
  #   # what data that is more than one file needs. Give them a directory of
  #   # their own when a reader expects to find them side by side - an EMPAD
  #   # `.xml` names its `.raw` by bare file name and opens it next to itself.
  #   members:
  #     - member: Figure_01/Panel_a/acquisition_12.xml
  #       file: MyDatasetName/acquisition_12.xml
  #       checksum: md5:0123456789abcdef0123456789abcdef
  #       size_bytes: 4000
  #     - member: Figure_01/Panel_a/scan_x128_y128.raw
  #       file: MyDatasetName/scan_x128_y128.raw
  #       checksum: md5:0123456789abcdef0123456789abcdef
  #       size_bytes: 1000000
  # Who made the detector. See vendors.yaml for the names already in use.
  detector_manufacturer: Direct Electron
  # The detector model.
  detector: DE-16
  # Who made the microscope. See vendors.yaml for the names already in use.
  microscope_vendor: Thermo Fisher Scientific
  # The microscope model.
  microscope_model: Gen 1 Titan
  # Camera length, with its unit.
  camera_length: 100 mm
  # Accelerating voltage, as `<number> kV`.
  voltage: 200 kV
  # The licence the data is released under, as an SPDX identifier.
  license: CC-BY-4.0
  # How the data was taken, from the `acquisition` list in techniques.yaml. One
  # per line; give every technique the dataset is, and it appears under each of
  # them. A `kind: weights` entry adds the `ML - ...` tasks the model performs.
  technique:
    - 4D-STEM
  # DOI of the record or the paper, without a `https://doi.org/` prefix.
  doi: 10.5281/zenodo.0000000
  # Free-form keywords, one per line. Searched by `emdatabase.search`.
  tags:
    - Amorphous
    - Strain
  # Who to credit, keyed by name. `affiliation` is required for each.
  authors:
    Jane Doe:
      affiliation: University of Somewhere
      # ORCID as `0000-0000-0000-0000`. The last character may be `X`, which is
      # a legal check digit rather than a typo.
      orcid: 0000-0002-1825-0097
  # What the entry hands out: `dataset` (the default) or `weights` for a model checkpoint.
  kind: dataset
  # Required for `kind: weights`, and not allowed on a dataset. `class` is the
  # dotted import path of the model, `quantem` the versions it loads under.
  # model:
  #   class: quantem.diffractive_imaging.ObjectINR
  #   framework: torch
  #   quantem: ">=0.2,<0.3"
  # Required for `kind: weights`, and not allowed on a dataset. The published
  # link the entry follows; `url`, `checksum` and `size_bytes` live here rather
  # than at the top level, and `download()` returns whatever it serves. On
  # Zenodo, give the current record's file link.
  # latest:
  #   url: https://drive.google.com/uc?export=download&id=0123456789abcdef
  #   checksum: md5:0123456789abcdef0123456789abcdef
  #   size_bytes: 1000000
  # Required for `kind: weights`, and not allowed on a dataset. One pinned
  # snapshot of what that link served, keyed by a quoted YYMMDD date, which is
  # what `download(version="260902")` hands out. At least one is needed; the
  # weekly CI job adds a new one whenever the link's md5 changes, or a new
  # Zenodo record is published under the same concept. A version stays where
  # its bytes are permanent - its own Zenodo record - and is copied to the
  # `weights-archive` release only when it sits on a link that can move.
  # versions:
  #   "260902":
  #     url: https://github.com/electronmicroscopy/emdatabase/releases/download/weights-archive/MyModel_260902.pt
  #     checksum: md5:0123456789abcdef0123456789abcdef
  #     size_bytes: 1000000
