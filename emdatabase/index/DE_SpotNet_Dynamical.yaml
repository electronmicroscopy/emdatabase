# $schema: ./json-schema.json
DE_SpotNet_Dynamical:
  description: >-
    DE SpotNet fine-tuned on multislice (dynamical) disks with counted and integrating detector
    noise, then self-trained on real 4D-STEM frames whose labels are persistence- and Friedel-
    verified. A disk-coverage head centers each disk on its predicted aperture. Halves the
    center error on dynamical disks and cuts false positives on sparse counted data; on real
    SPED Ag the in-grain strain speckle drops from 0.063 to 0.036 %. An ONNX graph (BatchNorm
    folded, opset 17, dynamic batch/height/width, configuration in the model metadata) for
    inference with ONNX Runtime; the torch checkpoint for training and fine-tuning is the
    DE_SpotNet_Dynamical_Torch entry. Licensed CC BY-NC 4.0: commercial use (for example,
    analyzing your own data at a company) is permitted; the weights may not be redistributed in,
    or incorporated into, software or services that are sold.
  source: https://zenodo.org/records/23383572/files
  file: de_spotnet_dynamical.onnx
  license: CC-BY-NC-4.0
  technique:
    - 4D-STEM
    - Diffraction
    - ML - peak finding
  doi: 10.5281/zenodo.23383571
  tags:
    - Machine Learning
    - Vector finding
    - Bragg disk detection
    - Dynamical diffraction
    - Direct Electron
  authors:
    Carter Francis:
      affiliation: Direct Electron
  kind: weights
  model:
    class: onnxruntime.InferenceSession
    framework: onnx
