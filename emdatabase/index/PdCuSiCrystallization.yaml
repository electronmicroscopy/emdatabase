# $schema: ./json-schema.json
PdCuSiCrystallization:
  description: A time resolved 4D-STEM series following the crystallization of a PdCuSi
    metallic glass, acquired on a Direct Electron CeleritasXS at 40000 fps with a 25
    microsecond dwell time. 400 sequential scans of 47 x 39 probe positions (a 23.5 x
    19.5 nm region cropped from a 256 x 256 scan) of 128 x 128 pixel diffraction
    patterns. Both real and reciprocal space are calibrated - 0.5 nm per scan step and
    0.11 1/nm per detector pixel, centred on the direct beam. Successive scans are
    1.6384 s apart and span 655.36 s of elapsed time, although the time axis is stored
    with a nm unit label. 24 GB of uint16 data uncompressed, chunked one time step at
    a time - the dataset used in the pyxem large data and lazy processing demo.
  source: https://zenodo.org/records/15490547/files
  checksum: md5:80ec7f95ec250106c586debf5d814325
  file: PdCuSiCrystalization-zip.zspy
  size_bytes: 5748299565
  detector_manufacturer: Direct Electron
  detector: CeleritasXS
  voltage: 200 kV
  license: CC-BY-4.0
  doi: 10.5281/zenodo.15490547
  technique: 4D-STEM
  tags:
