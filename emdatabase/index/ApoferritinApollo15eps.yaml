# $schema: ./json-schema.json
ApoferritinApollo15eps:
  description: A single cryo-EM movie of apoferritin from one stage position, collected
    at a 15 e-/pix/s dose rate on a Direct Electron Apollo. 76 unaligned, dark-subtracted
    counted super-resolution frames of 8192 x 8192 pixels at 0.2995 Angstrom per pixel,
    totalling 56.96 e-/Angstrom^2 (0.7495 e-/Angstrom^2 per frame). The super-resolution
    gain reference needed for frame correction is embedded in the file at
    metadata.Acquisition_instrument.TEM.Detector.gain_reference. Repackaged from
    EMPIAR-11254; see Peng et al., J Struct Biol X 7 (2022) 100080.
  source: https://zenodo.org/records/21632101/files
  checksum: md5:ce63b6d28567b6a74b8c12712b6dab21
  file: ApoferritinApollo15eps.zspy
  size_bytes: 483010772
  detector_manufacturer: Direct Electron
  detector: Apollo
  license: CC0-1.0
  technique: Cryo-EM
  doi: 10.5281/zenodo.21632101
  tags:
    - Cryo-EM
    - Single Particle
    - Counted
    - Movie
    - Dose Fractionation
  authors:
    Scott M. Stagg:
      affiliation: Florida State University
      orcid: 0000-0001-8855-4152
  kind: dataset
