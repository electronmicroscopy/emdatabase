DE_SpotNet_Production_Torch:
  description: >-
    DE SpotNet variant with short-range-order augmentation and an edge-decoupled head; slightly
    higher recall on crystalline 4D-STEM at the canonical disk size, weaker off its trained
    scale. The torch checkpoint, for training and fine-tuning: a dict with the state_dict and
    the architecture scalars, loaded with torch.load(path, weights_only=True). The ONNX graph
    for inference is the DE_SpotNet_Production entry. Licensed CC BY-NC 4.0: commercial use (for
    example, analyzing your own data at a company) is permitted; the weights may not be
    redistributed in, or incorporated into, software or services that are sold.
