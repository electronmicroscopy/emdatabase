name: on_new_issue

# Turns an issue filed through the "New Dataset" form into an index entry and
# a pull request. Runs when the form applies the new_dataset label, when a
# maintainer applies it later, or by hand with the issue number.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to turn into a dataset entry
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-dataset-yaml:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'new_dataset')
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and package
        run: pip install -U -e .'[dev]'

      - name: Fetch the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.inputs.issue || github.event.issue.number }}
        run: |
          echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"
          gh issue view "$ISSUE" --json title --jq .title > issue_title.txt
          gh issue view "$ISSUE" --json body --jq .body > issue_body.txt

      - name: Parse issue and write YAML
        run: |
          set -o pipefail
          python .github/scripts/issue_to_yaml.py issue_body.txt emdatabase/index/ 2>&1 | tee parse.log
          python -m emdatabase._create_stubs

      - name: Tell the issue what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The entry could not be built from this issue. The last lines of the log:"
            echo
            echo '```'
            tail -n 15 parse.log 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "Edit the issue to fix it, then a maintainer can re-apply the \`new_dataset\` label to run again. Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.EMDATABASE_PAT || secrets.GITHUB_TOKEN }}
          add-paths: |
            emdatabase/index/*.yaml
            emdatabase/data/__init__.pyi
          branch: add-dataset-${{ env.ISSUE }}
          commit-message: "Add index entry from issue #${{ env.ISSUE }}"
          title: "Add ${{ github.event.issue.title || 'dataset' }} from issue #${{ env.ISSUE }}"
          body: |
            Index entry generated from the New Dataset form.

            Closes #${{ env.ISSUE }}
