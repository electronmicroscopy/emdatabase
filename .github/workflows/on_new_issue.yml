name: on_new_issue

on:
  issues:
    types: [opened]

jobs:
  create-dataset-yaml:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'new_dataset')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies and package
        run: pip install -U -e .'[dev]'

      - name: Extract issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue_body.txt

      - name: Parse issue and write YAML
        run: |
          python .github/scripts/issue_to_yaml.py issue_body.txt emdatabase/index/

      - name: Commit new YAML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b add-dataset-${{ github.run_id }}
          git add emdatabase/index/*.yaml
          git commit -m "Add new dataset YAML from issue"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.EMDATABASE_PAT || secrets.GITHUB_TOKEN }}
          branch: add-dataset-${{ github.run_id }}
          title: "Add new dataset YAML"
          body: "This PR adds a new dataset YAML file generated from the issue form."