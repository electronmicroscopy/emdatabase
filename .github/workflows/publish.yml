name: publish

# Publishing is deliberately manual: either cut a GitHub release, or run this
# workflow by hand. A version can only ever be uploaded to PyPI once, so this
# never triggers on a plain push.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Check the data files made it into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          n_yaml = sum(n.endswith(".yaml") for n in names)
          print(f"{wheel}: {n_yaml} dataset YAML files")
          if n_yaml == 0:
              sys.exit("no dataset YAML files in the wheel - package-data is broken")
          if not any("json-schema" in n for n in names):
              sys.exit("json-schema.json missing from the wheel")
          PY

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["TAG"].lstrip("v")
          print(f"pyproject version {version!r}, release tag {tag!r}")
          if version != tag:
              sys.exit(f"version mismatch: pyproject says {version}, tag says {tag}")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/checkenv
          /tmp/checkenv/bin/python -m pip install --quiet dist/*.whl
          /tmp/checkenv/bin/python -c "
          import emdatabase.data as d
          print('datasets registered:', len(d.__all__))
          assert len(d.__all__) > 0, 'no datasets registered'
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
