name: documentation

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          pip install -U -e .'[doc]'

      # The gallery examples download BilayerWS2 from Zenodo, which times out
      # now and then; keep the download between runs, keyed on the index.
      - name: Cache example downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/emdatabase
          key: emdatabase-data-${{ hashFiles('emdatabase/index/*.yaml') }}
          restore-keys: emdatabase-data-

      - name: Fetch the example dataset ahead of the build
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4 5; do
            python -c "from emdatabase.data import BilayerWS2; BilayerWS2().download(background=False)" && break
            echo "attempt $attempt failed; retrying in 60 s"
            sleep 60
          done

      - name: Sphinx build
        timeout-minutes: 15
        run: |
          make html -C docs 2>&1 | tee sphinx.log

      # A failed gallery example only warns (see conf.py), so say so where a
      # green check is read: an annotation on the run and the job summary.
      - name: Report failed gallery examples
        run: |
          if grep -q "Unexpected failing examples" sphinx.log; then
            failed=$(sed -n '/Unexpected failing examples/,/^$/p' sphinx.log | sed 's/\x1b\[[0-9;]*m//g')
            echo "::warning title=Gallery examples failed::$(echo "$failed" | tr '\n' ' ')"
            { echo "## Gallery examples failed"; echo; echo '```'; echo "$failed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ github.run_id }}
          path: docs/build/html
          retention-days: 14

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:  docs/build/html
          force_orphan: true